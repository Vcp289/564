<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>สร้างรหัสปลดล็อก (สำหรับผู้ขายเท่านั้น)</title>
</head>
<body style="margin:0;background:#0b0e13;color:#fff;font:15px -apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box">
<div style="width:100%;max-width:380px">
<h1 style="font-size:18px;margin:0 0 4px">🔑 สร้างรหัสปลดล็อก LuckyNumber</h1>
<p style="color:#94a3b8;font-size:13px;margin:0 0 18px">หน้านี้สำหรับผู้ขายเท่านั้น อย่าส่งลิงก์นี้ให้ผู้ซื้อ — ตั้งชื่อ/รหัสอ้างอิงของผู้ซื้อ (Serial) แล้วกด "สร้างรหัส" เพื่อได้รหัสปลดล็อกไปส่งให้ลูกค้า</p>
<label style="display:block;font-size:13px;color:#94a3b8;margin-bottom:6px">Serial (ตั้งเองได้ เช่น ชื่อลูกค้า/เลขออเดอร์ — A-Z 0-9 ยาว 2-16 ตัว)</label>
<input id="serial" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="เช่น NAME01" style="width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid #263140;background:#10151d;color:#fff;font-size:16px;letter-spacing:1px">
<button id="generate" style="width:100%;margin-top:12px;padding:12px;border-radius:12px;border:none;background:#0a84ff;color:#fff;font-size:15px;font-weight:600">สร้างรหัส</button>
<div id="result" style="margin-top:16px;font-size:20px;font-weight:700;letter-spacing:1px;text-align:center;word-break:break-all"></div>
<div id="copyHint" style="margin-top:6px;text-align:center;font-size:12px;color:#94a3b8"></div>
</div>
<script>(function(){
// ต้องเป็นค่าเดียวกับ SECRET ใน index.html เป๊ะ ไม่งั้นรหัสที่สร้างจะปลดล็อกไม่ได้
var SECRET="LN564-SECRET-CHANGE-ME";
function checksum(str){
var h1=0x811c9dc5,h2=0x9e3779b9;
for(var i=0;i<str.length;i++){
var c=str.charCodeAt(i);
h1=(h1^c)>>>0;h1=Math.imul(h1,16777619)>>>0;
h2=(h2+c)>>>0;h2=Math.imul(h2,2654435761)>>>0;h2=(h2^(h2>>>15))>>>0;
}
return ((h1^h2)>>>0).toString(36).toUpperCase().padStart(7,"0").slice(-7);
}
var serialInput=document.getElementById("serial"),result=document.getElementById("result"),copyHint=document.getElementById("copyHint");
document.getElementById("generate").addEventListener("click",function(){
var serial=String(serialInput.value||"").trim().toUpperCase();
if(!/^[A-Z0-9]{2,16}$/.test(serial)){result.textContent="";copyHint.textContent="กรอก Serial เป็นตัวอักษร/เลข A-Z 0-9 ยาว 2-16 ตัว";return}
var code="LN-"+serial+"-"+checksum(serial+"|"+SECRET);
result.textContent=code;
copyHint.textContent="แตะที่รหัสเพื่อคัดลอก";
result.onclick=function(){
try{navigator.clipboard&&navigator.clipboard.writeText(code);copyHint.textContent="✓ คัดลอกแล้ว"}catch(_){}
};
});
serialInput.addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("generate").click()});
})();</script>
</body>
</html>
