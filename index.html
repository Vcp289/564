  <style>
    html,body{background:#f4f5f8}

<style>
.instant-boot-shell{min-height:100vh;position:relative;background:#fff;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
.instant-boot-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:850;line-height:1;letter-spacing:-.4px;text-align:center}
.instant-boot-spinner{position:absolute;left:50%;top:calc(50% + 48px);transform:translateX(-50%);width:22px;height:22px;border:2px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:lnspin .7s linear infinite}
.instant-boot-text{position:absolute;left:50%;top:calc(50% + 82px);transform:translateX(-50%);font-size:12px;color:#6b7280;font-weight:700;white-space:nowrap}
@keyframes lnspin{to{transform:translateX(-50%) rotate(360deg)}}
@media(prefers-color-scheme:dark){.instant-boot-shell{background:#0b0f14;color:#f8fafc}.instant-boot-spinner{border-color:#26303d;border-top-color:#60a5fa}.instant-boot-text{color:#94a3b8}}
</style>
