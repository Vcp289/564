  <div id="app"><div class="instant-frame-shell" aria-hidden="true"><div class="instant-frame-top"></div><div class="instant-frame-card"></div><div class="instant-frame-nav"><span>Calculate</span><span>AI</span><span>History</span><span>Analysis</span><span>Settings</span></div></div></div>
  <script>
  // V8.14.15 FIX2: stable SW bootstrap. Starts the update check immediately on launch;
  // it never touches localStorage/IndexedDB/History.
  if("serviceWorker" in navigator){
    const APP_BUILD="81431turbo6";
    let didReload=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(didReload) return;
      didReload=true;
      try{
        const k="ln_sw_reload_"+APP_BUILD;
        if(sessionStorage.getItem(k)!=="1"){
          sessionStorage.setItem(k,"1");
          location.reload();
        }
      }catch(_){ location.reload(); }
    });
    window.addEventListener("load",()=>{
      // Versioned SW URL forces iOS/PWA to revalidate the worker script instead of
      // silently reusing an older cached registration.
      navigator.serviceWorker.register("sw.js?b="+APP_BUILD,{scope:"./",updateViaCache:"none"}).then(reg=>{
        reg.update().catch(()=>{});
        const wake=w=>{ try{ w?.postMessage({type:"SKIP_WAITING"}); }catch(_){} };
        wake(reg.waiting);
        reg.addEventListener("updatefound",()=>{
          const w=reg.installing;
          if(!w) return;
          w.addEventListener("statechange",()=>{ if(w.state==="installed") wake(reg.waiting||w); });
        });
        // A no-store build probe also breaks iOS's stale home-screen shell cache.
        fetch("version.json?b="+APP_BUILD+"&t="+Date.now(),{cache:"no-store"}).catch(()=>{});
      }).catch(()=>{});
    },{once:true,passive:true});
  }
  </script>

  <script>
  // Pro 4: load heavy X3 only in an idle slice after first paint; timeout preserves reliability.
  (()=>{const inject=()=>{if(document.querySelector('script[data-x3-pro]'))return;const s=document.createElement("script");s.src="releases/81431turbo6/x3-pro.js";s.async=true;s.dataset.x3Pro="1";s.onload=()=>window.dispatchEvent(new Event("x3-pro-ready"));document.body.appendChild(s);};const load=()=>{if("requestIdleCallback" in window)requestIdleCallback(inject,{timeout:1800});else setTimeout(inject,1100);};if(document.readyState==="complete")load();else window.addEventListener("load",load,{once:true,passive:true});})();
  </script>
