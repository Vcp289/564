<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a84ff">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LuckyNumber">
  <title>LuckyNumber Pro V7.19.00 Pattern V19 Precision Rescue</title>
  <link rel="manifest" href="manifest.json?v=71900p19rescue">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="style-r32.css?v=71900p19rescue">
  <style>
    html,body{background:#f4f5f8}
    @media (prefers-color-scheme:dark){html,body{background:#0b0e13}}
  </style>
<style>
.instant-boot-shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
.instant-boot-brand{font-size:22px;font-weight:800;letter-spacing:-.3px}
.instant-boot-spinner{width:22px;height:22px;border:2px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:lnspin .7s linear infinite}
.instant-boot-text{font-size:12px;color:#6b7280;font-weight:700}
@keyframes lnspin{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){.instant-boot-shell{background:#0b0f14;color:#f8fafc}.instant-boot-spinner{border-color:#26303d;border-top-color:#60a5fa}.instant-boot-text{color:#94a3b8}}
</style>
</head>
<body>
  <div id="app"><div class="instant-boot-shell" role="status" aria-live="polite">
      <div class="instant-boot-brand">LuckyNumber</div>
      <div class="instant-boot-spinner"></div>
      <div class="instant-boot-text">Opening…</div>
    </div></div>
  <script src="app-r32.js?v=71900p19rescue"></script>

</body>
</html>
