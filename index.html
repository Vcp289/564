<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a84ff">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LuckyNumber V5.4.3 Stable">
  <title>LuckyNumber Pro V5.4.3 Stable</title>
  <link rel="manifest" href="manifest.json?v=543">
  <link rel="stylesheet" href="style.css?v=543">
  <script>
    window.__showLoadError = function () {
      var root = document.getElementById('app');
      if (!root) return;
      root.innerHTML = '<main style="padding:calc(30px + env(safe-area-inset-top)) 18px;font-family:-apple-system,BlinkMacSystemFont,sans-serif"><section style="max-width:560px;margin:auto;background:#fff;border-radius:22px;padding:22px"><h1 style="font-size:22px">เปิดแอปไม่สำเร็จ</h1><p style="color:#64748b;line-height:1.6">ไฟล์แอปอาจยังเป็น Cache รุ่นเก่า ข้อมูล History ยังไม่ถูกลบ</p><button onclick="location.reload()" style="width:100%;padding:15px;border:0;border-radius:14px;background:#0a66ff;color:#fff;font-size:17px;font-weight:700">โหลดใหม่</button></section></main>';
    };
    window.addEventListener('error', function (event) {
      if (event && event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) window.__showLoadError();
    }, true);
    try {
      if ('serviceWorker' in navigator && typeof navigator.serviceWorker.getRegistrations === 'function') {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
      }
    } catch (_) {}
  </script>
</head>
<body>
  <div id="app"><div style="padding:calc(40px + env(safe-area-inset-top)) 20px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#64748b">กำลังเปิด LuckyNumber…</div></div>
  <script src="app.js?v=543" defer onerror="window.__showLoadError()"></script>
</body>
</html>
