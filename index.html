<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a84ff">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LuckyNumber">
  <title>LuckyNumber Pro V7.20.14 iOS Migration Fast Boot</title>
  <link rel="manifest" href="manifest.json?v=72014migration">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="style-r44.css?v=72014migration">
  <script>
  // V7.20.14: preserve the exact legacy worker URL that installed V7.20.12 clients know.
  // This updates the existing PWA registration in place and never clears app data.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw-r42.js?v=72012unifiedai", { updateViaCache: "none" })
      .then(function(reg){
        navigator.serviceWorker.addEventListener("controllerchange", function(){
          if (sessionStorage.getItem("ln-v72014-controller")) return;
          sessionStorage.setItem("ln-v72014-controller", "1");
          location.reload();
        });
        try { reg.update(); } catch(_) {}
      })
      .catch(function(){});
  }
  </script>
  <style>
    html,body{background:#f4f5f8}
    @media (prefers-color-scheme:dark){html,body{background:#0b0e13}}
    .instant-boot-shell{min-height:100vh;position:relative;background:#fff;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
    .instant-boot-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:850;line-height:1;letter-spacing:-.4px;text-align:center}
    .instant-boot-spinner{position:absolute;left:50%;top:calc(50% + 48px);transform:translateX(-50%);width:22px;height:22px;border:2px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:lnspin .7s linear infinite}
    .instant-boot-text{position:absolute;left:50%;top:calc(50% + 82px);transform:translateX(-50%);font-size:12px;color:#6b7280;font-weight:700;white-space:nowrap}
    @keyframes lnspin{to{transform:translateX(-50%) rotate(360deg)}}
    @media(prefers-color-scheme:dark){.instant-boot-shell{background:#0b0f14;color:#f8fafc}.instant-boot-spinner{border-color:#26303d;border-top-color:#60a5fa}.instant-boot-text{color:#94a3b8}}
  </style>
</head>
<body>
  <div id="app"><div class="instant-boot-shell" role="status" aria-live="polite">
    <div class="instant-boot-brand">365</div>
    <div class="instant-boot-spinner"></div>
    <div class="instant-boot-text">Opening…</div>
  </div></div>
  <script src="app-r44.js?v=72014migration"></script>
</body>
</html>
