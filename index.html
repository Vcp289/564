<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f2f4f8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LuckyNumber">
  <title>365</title>
  <link rel="manifest" href="manifest.json?v=71908stable">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="style-r32.css?v=71908stable">
  <style>
    html,body{background:#f4f5f8}
    @media (prefers-color-scheme:dark){html,body{background:#0b0e13}}
  </style>
<style>
.instant-boot-shell{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f2f4f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
.instant-boot-brand{font-size:64px;font-weight:800;line-height:.95;letter-spacing:-3px}
.instant-boot-spinner{width:20px;height:20px;border:2px solid #d8dee8;border-top-color:#168bff;border-radius:50%;animation:lnspin .65s linear infinite}
.instant-boot-text{display:none}
@keyframes lnspin{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){.instant-boot-shell{background:#090d14;color:#f8fafc}.instant-boot-spinner{border-color:#26303d;border-top-color:#60a5fa}}
</style>
</head>
<body>
  <div id="app"><div class="instant-boot-shell" role="status" aria-live="polite">
      <div class="instant-boot-brand">365</div>
      <div class="instant-boot-spinner"></div>
      
    </div></div>
  <script src="app-r32.js?v=71908stable"></script>

</body>
</html>
