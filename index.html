  <script>
  // V8.16.62 — on-screen JS error overlay (temporary diagnostic aid).
  // Catches uncaught errors and unhandled promise rejections from ANY script loaded after
  // this point (including app.js) and shows them as a visible, screenshot-able red box —
  // no Mac / Safari Web Inspector / cable connection required. Purely additive: it only
  // renders anything if a real error actually fires, so it changes nothing when the app is
  // working normally.
  (function(){
    var box=null, seen=[];
    function ensureBox(){
      if(box) return box;
      box=document.createElement('div');
      box.id='__jsErrorOverlay';
      box.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;background:#3a0000;color:#fff;font:12px/1.5 -apple-system,monospace;padding:12px;z-index:2147483647;white-space:pre-wrap;border-top:3px solid #ff3b30;box-shadow:0 -4px 16px rgba(0,0,0,.4)';
      var title=document.createElement('div');
      title.textContent='⚠️ JS Error (แตะที่นี่เพื่อคัดลอกทั้งหมด)';
      title.style.cssText='font-weight:700;margin-bottom:8px;font-size:13px';
      title.onclick=function(){
        try{
          var text=seen.join('\n\n---\n\n');
          if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text);
        }catch(_){}
      };
      box.appendChild(title);
      document.body.appendChild(box);
      return box;
    }
    function report(label,detail){
      seen.push(label+'\n'+detail);
      var b=ensureBox();
      var entry=document.createElement('div');
      entry.style.cssText='margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.2)';
      entry.textContent=label+'\n'+detail;
      b.appendChild(entry);
    }
    window.addEventListener('error',function(e){
      var msg=e.message||'Unknown error';
      var loc=(e.filename||'?')+':'+(e.lineno||'?')+':'+(e.colno||'?');
      var stack=e.error&&e.error.stack?String(e.error.stack):'';
      report('window.onerror: '+msg,'at '+loc+(stack?'\n'+stack:''));
    });
    window.addEventListener('unhandledrejection',function(e){
      var reason=e.reason;
      var msg=reason&&reason.message?reason.message:String(reason);
      var stack=reason&&reason.stack?String(reason.stack):'';
      report('unhandledrejection: '+msg,stack);
    });
  })();
  </script>

  <script>
  // V8.14.15 FIX2: stable SW bootstrap. Starts the update check immediately on launch;
  // it never touches localStorage/IndexedDB/History.
  if("serviceWorker" in navigator){
    // app.js observes this marker and skips its older duplicate registration path.
    // One shell update probe is enough; duplicate registrations can compete with the
    // first idle period on iOS without making the app more up to date.
    window.__lnShellRegistrationScheduled=true;
    const APP_BUILD="81604fastfinal84";
    let didReload=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(didReload) return;
      didReload=true;
      // V8.16.6: this used to gate the reload behind a sessionStorage flag keyed only
      // by a build tag that was never actually bumped here, so after the first reload
      // in a session, every later legitimate controllerchange (a genuinely new SW taking
      // over) was silently ignored — the page kept running whatever was already loaded.
      // During active fixes this must always reload once per real controller change.
      location.reload();
    });
    window.addEventListener("load",()=>{
      // Versioned SW URL forces iOS/PWA to revalidate the worker script instead of
      // silently reusing an older cached registration.
      navigator.serviceWorker.register("sw.js?b="+APP_BUILD,{scope:"./",updateViaCache:"none"}).then(reg=>{
        reg.update().catch(()=>{});
        const wake=w=>{ try{ w?.postMessage({type:"SKIP_WAITING"}); }catch(_){} };
        wake(reg.waiting);
        reg.addEventListener("updatefound",()=>{
          const w=reg.installing;
          if(!w) return;
          w.addEventListener("statechange",()=>{ if(w.state==="installed") wake(reg.waiting||w); });
        });
        // A no-store build probe also breaks iOS's stale home-screen shell cache.
        fetch("version.json?b="+APP_BUILD+"&t="+Date.now(),{cache:"no-store"}).catch(()=>{});
      }).catch(()=>{});
    },{once:true,passive:true});
  }
  </script>
